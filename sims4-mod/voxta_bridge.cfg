# Voxta bridge settings. Lines starting with # are comments.
# Defaults work when Voxta Server runs on this same computer.

# Where Voxta Server runs. 127.0.0.1 means this computer.
host = 127.0.0.1

# Must match "Game connection port" in Voxta: Modules -> The Sims 4 -> Configure.
port = 5385

# Seconds between household updates sent to Voxta (unchanged updates are skipped).
state_interval = 2

# true writes more detail to voxta_bridge.log (in this folder).
debug = false
